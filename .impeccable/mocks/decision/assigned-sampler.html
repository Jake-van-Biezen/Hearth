<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearth — Sampler sketch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#3c3323; font-family:'Karla',sans-serif; color:#2d2a26; }
  .frame {
    width:390px; height:844px; margin:0 auto; position:relative; overflow:hidden;
    background-color:#f6f1e7;
    background-image:
      linear-gradient(rgba(195,148,90,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(195,148,90,.10) 1px, transparent 1px),
      radial-gradient(120% 90% at 50% 0%, #f8f4ec 60%, #efe7d6 100%);
    background-size:24px 24px, 24px 24px, 100% 100%;
  }
  .corner { position:absolute; width:24px; height:24px; color:#b3402e; opacity:.55; }
  .corner.tl { top:20px; left:20px; }
  .corner.tr { top:20px; right:20px; transform:scaleX(-1); }
  .mark { position:absolute; top:0; left:0; right:0; }
  .wordmark {
    position:absolute; top:218px; width:100%; text-align:center;
    font-family:'Silkscreen',monospace; font-weight:700; font-size:76px;
    color:#b3402e; letter-spacing:1px;
    text-shadow: 2px 2px 0 #8d2f21;   /* second thread pass */
  }
  .tack { position:absolute; top:196px; width:100%; display:flex; justify-content:center; }
  .tagline {
    position:absolute; top:326px; width:100%; text-align:center;
    font-size:17px; line-height:1.4; color:#5d564a;
  }
  .measure {
    position:absolute; top:388px; left:50%; transform:translateX(-50%);
    width:212px; height:0; border-top:1px solid rgba(179,64,46,.35);
  }
  .cta {
    position:absolute; top:470px; left:50%; transform:translateX(-50%);
    width:300px; padding:15px 0; border-radius:999px; text-align:center;
    background:#ffffff; border:1px solid #dad3c2; box-shadow:0 1px 0 rgba(45,42,38,.08);
    font-size:15px; font-weight:600; color:#2d2a26;
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .cta svg { width:20px; height:20px; display:block; }
  .alt {
    position:absolute; top:560px; width:100%; text-align:center;
    font-size:13px; color:#8a8070;
  }
  .home {
    position:absolute; bottom:44px; width:100%; text-align:center;
    font-size:13.5px; color:#8a8070; letter-spacing:.2px;
  }
  .stitchline {
    position:absolute; bottom:96px; left:50%; transform:translateX(-50%);
    width:180px; border-top:2px dashed rgba(179,64,46,.5);
  }
</style>
</head>
<body>
<div class="frame">
  <!-- stitched corner crosses -->
  <svg class="corner tl" viewBox="0 0 24 24"><path d="M4 4h4v4H4zM12 4h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4z" fill="currentColor"/></svg>
  <svg class="corner tr" viewBox="0 0 24 24"><path d="M4 4h4v4H4zM12 4h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4z" fill="currentColor"/></svg>

  <!-- thread tack holding the wordmark -->
  <div class="tack">
    <svg width="16" height="10" viewBox="0 0 16 10"><path d="M1 8 C4 2, 12 2, 15 8" stroke="#8d2f21" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>

  <h1 class="wordmark">Hearth</h1>

  <p class="tagline">One calendar. Every one of us.</p>
  <div class="measure"></div>

  <div class="cta">
    <svg viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 3.18 29.93 1 24 1 14.4 1 6.04 6.93 2.42 15.12l9.27 5.7C13.42 15.62 18.15 9.75 24 9.75z"/>
      <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
      <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H2.42C.88 17.09 0 20.45 0 24s.88 6.91 2.42 9.88l9.27-5.7z"/>
      <path fill="#34A853" d="M24 47c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H2.42v5.7C6.04 41.07 14.4 47 24 47z"/>
    </svg>
    Continue with Google
  </div>

  <p class="alt">Runs on our own home server &mdash; nothing shared out.</p>

  <div class="stitchline"></div>
  <p class="home">Our family, our days.</p>
</div>
</body>
</html>
