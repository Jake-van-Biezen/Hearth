<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Karla,sans-serif;color:#22252a;background:#fbfaf4;
background-image:linear-gradient(rgba(122,150,190,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(122,150,190,.16) 1px,transparent 1px);background-size:26px 26px;position:relative}
.margin{position:absolute;top:0;bottom:0;left:78px;width:3px;background:rgba(208,80,64,.5)}
header{display:flex;align-items:center;justify-content:space-between;padding:50px 16px 14px 18px;background:#fbfaf4;border-bottom:2px solid #22252a;position:relative;z-index:1}
.fam{font-family:'Permanent Marker';font-size:26px;color:#c0392b;transform:rotate(-2deg)}
.range{font-size:13px;color:#4c5260}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:999px;border:1px solid #c9ccd2;background:#fff;font:600 16px Karla;color:#22252a}
.row{display:grid;grid-template-columns:78px 1fr;border-bottom:1px solid rgba(34,37,42,.25);min-height:78px}
.row.we{background:rgba(208,80,64,.07)}
.row.today{background:#fff;box-shadow:inset 0 0 0 2px #22252a}
.lab{padding:10px 0 0 14px}
.lab b{display:block;font-family:'Permanent Marker';font-weight:400;font-size:17px;line-height:1}
.lab span{font-size:12px;color:#666b76}
.today .lab span{color:#c0392b;font-weight:700}
.evs{padding:9px 14px 9px 16px;display:flex;flex-direction:column;gap:6px}
.ev{display:flex;align-items:center;gap:8px;font-size:15px}
.ev time{width:42px;font-size:13px;font-weight:700;color:#4c5260}
.chip{border-radius:3px;padding:4px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.b{background:#3b78c4;color:#f2f6fb}.g{background:#3b9e6b;color:#f0f7f2}.y{background:#d9b12e;color:#3a2f10}
.all{font-size:13px;font-weight:700;border:1.5px dashed currentColor;border-radius:3px;padding:3px 8px;width:fit-content}
.empty{font-size:13px;color:#666b76;padding-top:4px}
.add{position:absolute;right:18px;bottom:30px;height:54px;padding:0 22px;border-radius:999px;background:#22252a;color:#fbfaf4;font:600 16px Karla;border:none;box-shadow:0 6px 18px -6px rgba(34,37,42,.5)}
</style></head><body>
<span class="margin"></span>
<header>
  <div><div class="fam">The Biezens</div><div class="range">19 – 25 Oct · week 43</div></div>
  <div class="nav"><button>‹</button><button>›</button></div>
</header>
<div class="row today"><div class="lab"><b>Mon</b><span>19 · today</span></div><div class="evs">
  <div class="ev"><time>08:15</time><span class="chip g">School photo</span></div>
  <div class="ev"><time>18:30</time><span class="chip b">Swim · Noor</span></div></div></div>
<div class="row"><div class="lab"><b>Tue</b><span>20</span></div><div class="evs">
  <div class="ev"><time>16:00</time><span class="chip b">Dentist · Sam</span></div></div></div>
<div class="row"><div class="lab"><b>Wed</b><span>21</span></div><div class="evs">
  <div class="all" style="color:#2d7a52">Study day, no school</div></div></div>
<div class="row"><div class="lab"><b>Thu</b><span>22</span></div><div class="evs">
  <div class="ev"><time>18:30</time><span class="chip b">Swim · Noor</span></div>
  <div class="ev"><time>19:00</time><span class="chip g">Parents' evening</span></div></div></div>
<div class="row"><div class="lab"><b>Fri</b><span>23</span></div><div class="evs"><div class="empty">Nothing planned</div></div></div>
<div class="row we"><div class="lab"><b>Sat</b><span>24</span></div><div class="evs">
  <div class="ev"><time>11:00</time><span class="chip b">Football · Sam</span></div>
  <div class="ev"><time>15:00</time><span class="chip y">Oma's birthday</span></div></div></div>
<div class="row we"><div class="lab"><b>Sun</b><span>25</span></div><div class="evs">
  <div class="all" style="color:#2d5f9e">Clocks go back</div></div></div>
<button class="add">+ Add</button>
</body></html>
